name: Test Usage of Live Share SDK packages in different JS environments

on:
    push:
        branches: [main, mainv2]
    pull_request:
        branches: [main, mainv2]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        strategy:
            matrix:
                node-version: [18.x]

        steps:
            - uses: actions/checkout@v3
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  
            - name: Setup npm config
              run: |
                npm config set network-timeout 300000
                npm config set fetch-retries 3
                npm config set fetch-retry-factor 2
                npm config set fetch-retry-mintimeout 20000
              
            - name: Install critical dependencies only
              run: |
                npm install --no-package-lock --no-save typescript eslint prettier
                npm install --no-package-lock --no-save -w packages/live-share
              timeout-minutes: 5
              
            - name: Install all dependencies
              id: npm-install
              run: npm ci --prefer-offline --no-audit --no-fund --no-optional
              timeout-minutes: 20
              env:
                NODE_OPTIONS: "--max-old-space-size=4096"
                
            - name: Run npm diagnostic if install fails
              run: node scripts/diagnose-npm-install.js
              if: ${{ failure() && steps.npm-install.conclusion == 'failure' }}
              
            - name: Build packages manually
              run: npm run build:packages
              timeout-minutes: 10

            - name: "test live-share with cjs app"
              run: npm run test
              working-directory: internal/usage-test/cjs-test

            - name: "test live-share with esm app"
              run: npm run test
              working-directory: internal/usage-test/esm-test

            - uses: pnpm/action-setup@v4
              name: Install pnpm for next step
              with:
                  version: 9
                  run_install: false
            - name: "test live-share with pnpm typescript esm app"
              run: pnpm run test
              working-directory: internal/usage-test/pnpm-test
